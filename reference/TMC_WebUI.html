<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMC Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Tiempos+Headline:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a1a;
      --bg-sidebar: #141414;
      --bg-input: #2a2a2a;
      --bg-hover: #252525;
      --bg-active: #2e2e2e;
      --bg-pill: #252525;
      --border: rgba(255,255,255,0.07);
      --border-input: rgba(255,255,255,0.12);
      --text-primary: #e8e8e0;
      --text-secondary: #888880;
      --text-tertiary: #505048;
      --text-muted: #606058;
      --accent: #cc6b4a;
      --free-color: #4ade80;
      --paid-color: #cc6b4a;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Inter', ui-sans-serif, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Icon Rail ── */
    .icon-rail {
      width: 48px; min-width: 48px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      align-items: center; padding: 12px 0; gap: 4px;
    }
    .rail-btn {
      width: 36px; height: 36px; border-radius: 8px; border: none;
      background: transparent; color: var(--text-tertiary);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.12s, color 0.12s;
    }
    .rail-btn:hover { background: var(--bg-hover); color: var(--text-secondary); }
    .rail-btn svg { width: 18px; height: 18px; }
    .rail-spacer { flex: 1; }
    .rail-bottom { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 4px; }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    /* ── Messages ── */
    #messages { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    /* ── Welcome ── */
    .welcome-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100%; padding: 0 24px 20px; text-align: center;
    }
    .welcome-project-badge {
      display: flex; align-items: center; gap: 8px;
      background: #252525; border: 1px solid var(--border);
      border-radius: 10px; padding: 6px 14px 6px 8px; margin-bottom: 32px;
    }
    .project-logo {
      width: 24px; height: 24px; border-radius: 6px;
      background: #2a3a2a; display: flex; align-items: center; justify-content: center;
    }
    .project-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .welcome-heading {
      font-family: 'Tiempos Headline', Georgia, serif;
      font-size: 44px; font-weight: 300; color: var(--text-primary);
      letter-spacing: -1.5px; line-height: 1.1;
      display: flex; align-items: center; gap: 14px;
    }
    .welcome-asterisk {
      color: var(--accent); font-size: 42px; line-height: 1;
      animation: spin 12s linear infinite; display: inline-block;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* ── Message rows ── */
    .message-row { padding: 20px 0 4px; animation: fadeUp 0.2s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .message-inner {
      max-width: 720px; margin: 0 auto; padding: 0 24px;
      display: flex; gap: 14px; align-items: flex-start;
    }
    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; margin-top: 2px;
    }
    .msg-avatar.user { background: linear-gradient(135deg, #4a7a4a, #2d5a2d); color: #fff; }
    .msg-avatar.assistant { background: transparent; font-size: 18px; color: var(--accent); }
    .msg-body { flex: 1; min-width: 0; }
    .msg-name { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
    .msg-text { font-size: 15px; color: var(--text-primary); line-height: 1.75; }
    .msg-text p { margin-bottom: 14px; }
    .msg-text p:last-child { margin-bottom: 0; }
    .msg-text strong { font-weight: 500; color: #eee; }
    .msg-text ul, .msg-text ol { padding-left: 22px; margin-bottom: 14px; }
    .msg-text li { margin-bottom: 5px; }
    .msg-text h1, .msg-text h2, .msg-text h3 { font-weight: 500; color: #eee; margin: 18px 0 8px; }
    .msg-text h1 { font-size: 20px; } .msg-text h2 { font-size: 17px; } .msg-text h3 { font-size: 15px; }
    .msg-text code {
      background: #2a2a2a; border: 1px solid var(--border);
      padding: 1px 7px; border-radius: 5px; font-size: 13px;
      font-family: 'SF Mono', monospace; color: #c9a96e;
    }

    /* ── Download card ── */
    .download-card {
      display: flex; align-items: center; gap: 12px;
      background: #242424; border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px; margin-top: 12px; max-width: 400px;
    }
    .download-icon {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px;
    }
    .download-icon.excel { background: #1a3a1a; }
    .download-icon.word { background: #1a1a3a; }
    .download-info { flex: 1; min-width: 0; }
    .download-title { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 2px; }
    .download-sub { font-size: 11px; color: var(--text-secondary); }
    .download-btn {
      padding: 6px 14px; border-radius: 8px; border: none;
      background: var(--accent); color: #fff; font-size: 12px; font-weight: 500;
      cursor: pointer; text-decoration: none; display: inline-block; transition: opacity 0.15s;
    }
    .download-btn:hover { opacity: 0.85; }

    /* ── Thinking ── */
    .thinking-row { padding: 16px 0; }
    .thinking-inner { max-width: 720px; margin: 0 auto; padding: 0 24px; display: flex; gap: 14px; align-items: center; }
    .thinking-text { font-size: 14px; color: var(--text-tertiary); display: flex; align-items: center; gap: 10px; }
    .thinking-dots { display: flex; gap: 4px; }
    .thinking-dots span {
      width: 5px; height: 5px; background: var(--text-tertiary);
      border-radius: 50%; animation: blink 1.4s ease-in-out infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
    .messages-end { height: 24px; }

    /* ── Input ── */
    .input-area { padding: 12px 24px 16px; flex-shrink: 0; }
    .input-box {
      max-width: 720px; margin: 0 auto;
      background: var(--bg-input); border: 1px solid var(--border-input);
      border-radius: 18px; transition: border-color 0.18s;
    }
    .input-box:focus-within { border-color: rgba(204,107,74,0.35); }
    #userInput {
      width: 100%; background: transparent; border: none; outline: none;
      color: var(--text-primary); font-size: 15px; font-family: inherit;
      line-height: 1.6; padding: 18px 20px 4px; resize: none;
      min-height: 58px; max-height: 200px; display: block;
    }
    #userInput::placeholder { color: var(--text-muted); }

    .input-bottom {
      display: flex; align-items: center; padding: 6px 10px 10px 14px; gap: 8px;
    }
    .input-add-btn {
      width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid var(--border-input); background: transparent;
      color: var(--text-secondary); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .input-add-btn svg { width: 14px; height: 14px; }
    .input-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

    /* ── Model selector dropdown ── */
    .model-selector-wrap { position: relative; }

    .model-selector-btn {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text-secondary);
      padding: 5px 10px; border-radius: 8px;
      border: 1px solid var(--border-input);
      background: transparent; cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
      font-family: inherit; white-space: nowrap;
    }
    .model-selector-btn:hover { background: var(--bg-hover); border-color: rgba(255,255,255,0.2); }

    .model-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .model-dot.free { background: var(--free-color); }
    .model-dot.paid { background: var(--paid-color); }

    .model-chevron { width: 12px; height: 12px; opacity: 0.5; transition: transform 0.15s; }
    .model-chevron.open { transform: rotate(180deg); }

    .model-dropdown {
      position: absolute; bottom: calc(100% + 8px); right: 0;
      background: #2a2a2a; border: 1px solid var(--border-input);
      border-radius: 12px; padding: 6px; min-width: 220px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      display: none; z-index: 100;
    }
    .model-dropdown.open { display: block; }

    .model-option {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 8px; cursor: pointer;
      transition: background 0.12s; border: none;
      background: transparent; width: 100%; text-align: left;
      font-family: inherit;
    }
    .model-option:hover { background: var(--bg-hover); }
    .model-option.selected { background: #333; }

    .model-option-info { flex: 1; min-width: 0; }
    .model-option-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .model-option-sub { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }

    .model-option-badge {
      font-size: 10px; font-weight: 600; padding: 2px 7px;
      border-radius: 10px; flex-shrink: 0;
    }
    .model-option-badge.free { background: rgba(74,222,128,0.12); color: var(--free-color); }
    .model-option-badge.paid { background: rgba(204,107,74,0.12); color: var(--paid-color); }

    .model-divider {
      height: 1px; background: var(--border); margin: 4px 0;
    }

    /* ── Send button ── */
    #sendBtn {
      width: 32px; height: 32px; background: var(--text-muted);
      border: none; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.1s; flex-shrink: 0;
    }
    #sendBtn.active { background: var(--accent); }
    #sendBtn:active { transform: scale(0.93); }
    #sendBtn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
    #sendBtn svg { width: 14px; height: 14px; fill: #fff; }

    /* ── Action pills ── */
    .action-pills {
      max-width: 720px; margin: 10px auto 0;
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    }
    .pill {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 20px;
      border: 1px solid var(--border); background: var(--bg-pill);
      color: var(--text-secondary); font-size: 13px; cursor: pointer;
      transition: background 0.12s, color 0.12s; font-family: inherit;
    }
    .pill:hover { background: #303030; color: var(--text-primary); }
    .pill svg { width: 14px; height: 14px; flex-shrink: 0; }

    .input-footer-text {
      text-align: center; font-size: 11px; color: var(--text-tertiary);
      margin-top: 10px; max-width: 720px; margin-left: auto; margin-right: auto;
    }

    @media (max-width: 600px) { .icon-rail { display: none; } .welcome-heading { font-size: 30px; } }
  </style>
</head>
<body>

  <!-- Icon Rail -->
  <nav class="icon-rail">
    <button class="rail-btn" title="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>
      </svg>
    </button>
    <button class="rail-btn" onclick="newChat()" title="New chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
    <button class="rail-btn" title="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </button>
    <button class="rail-btn" title="Chats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </button>
    <div class="rail-spacer"></div>
    <div class="rail-bottom">
      <button class="rail-btn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
      <button class="rail-btn" style="border-radius:50%;padding:0;">
        <div style="width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#4a7a4a,#2d5a2d);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;">T</div>
      </button>
    </div>
  </nav>

  <!-- Main -->
  <main class="main">
    <div id="messages">
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-project-badge">
          <div class="project-logo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <rect width="24" height="24" rx="4" fill="#2a5a2a"/>
              <text x="12" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#7fc97f" font-family="Inter,sans-serif">T</text>
            </svg>
          </div>
          <span class="project-name">TMC</span>
        </div>
        <div class="welcome-heading">
          <span class="welcome-asterisk">✳</span>
          <span id="greetingText">Good day</span>
        </div>
      </div>
      <div class="messages-end"></div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-box">
        <textarea id="userInput" placeholder="How can I help you today?" rows="1"
          onkeydown="handleKey(event)" oninput="onInput(this)"></textarea>
        <div class="input-bottom">
          <button class="input-add-btn" title="Attach">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
          <div class="input-right">

            <!-- ── Model Selector ── -->
            <div class="model-selector-wrap" id="modelSelectorWrap">
              <button class="model-selector-btn" onclick="toggleModelDropdown()" id="modelSelectorBtn">
                <div class="model-dot free" id="modelDot"></div>
                <span id="modelLabel">TMC AI</span>
                <svg class="model-chevron" id="modelChevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <path d="M6 9l6 6 6-6"/>
                </svg>
              </button>

              <div class="model-dropdown" id="modelDropdown">
                <!-- Free option -->
                <button class="model-option selected" id="opt-openrouter" onclick="selectModel('openrouter')">
                  <div class="model-dot free"></div>
                  <div class="model-option-info">
                    <div class="model-option-name">TMC AI</div>
                    <div class="model-option-sub">OpenRouter · For demo &amp; testing</div>
                  </div>
                  <span class="model-option-badge free">Free</span>
                </button>

                <div class="model-divider"></div>

                <!-- Paid option -->
                <button class="model-option" id="opt-claude" onclick="selectModel('claude')">
                  <div class="model-dot paid"></div>
                  <div class="model-option-info">
                    <div class="model-option-name">Claude Sonnet 4.6</div>
                    <div class="model-option-sub">Anthropic · For production</div>
                  </div>
                  <span class="model-option-badge paid">Paid</span>
                </button>

                <div class="model-divider"></div>

                <!-- GPT-4o -->
                <button class="model-option" id="opt-openai" onclick="selectModel('openai')">
                  <div class="model-dot" style="background:#10a37f;"></div>
                  <div class="model-option-info">
                    <div class="model-option-name">GPT-4o</div>
                    <div class="model-option-sub">OpenAI · Fast &amp; reliable</div>
                  </div>
                  <span class="model-option-badge paid">Paid</span>
                </button>
              </div>
            </div>
            <!-- ── End Model Selector ── -->

            <button class="rail-btn" title="Voice" style="width:30px;height:30px;color:var(--text-secondary);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
              </svg>
            </button>
            <button id="sendBtn" onclick="sendMessage()" title="Send">
              <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="input-footer-text">TMC Intelligence · Searches your live Drive data on every message</div>
    </div>
  </main>

<script>
  let isLoading = false;
  let selectedProvider = 'openrouter'; // default

  // Greeting
  (function() {
    const h = new Date().getHours();
    const g = h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening';
    document.getElementById('greetingText').textContent = g + ', User';
  })();

  // ── Model dropdown ────────────────────────────────────────────────────────
  function toggleModelDropdown() {
    const dd = document.getElementById('modelDropdown');
    const chevron = document.getElementById('modelChevron');
    const isOpen = dd.classList.contains('open');
    dd.classList.toggle('open', !isOpen);
    chevron.classList.toggle('open', !isOpen);
  }

  function selectModel(provider) {
    selectedProvider = provider;

    const labels = {
      'openrouter': { name: 'TMC AI',           dot: 'free',                     color: '' },
      'openai':     { name: 'GPT-4o',           dot: 'paid', customColor: '#10a37f' },
      'claude':     { name: 'Claude Sonnet 4.6', dot: 'paid',                    color: '' }
    };

    const selected = labels[provider];
    document.getElementById('modelLabel').textContent = selected.name;

    const dot = document.getElementById('modelDot');
    dot.className = 'model-dot ' + selected.dot;
    if (selected.customColor) dot.style.background = selected.customColor;
    else dot.style.background = '';

    // Update selected state
    ['openrouter', 'openai', 'claude'].forEach(p => {
      document.getElementById('opt-' + p).classList.toggle('selected', p === provider);
    });

    // Close dropdown
    document.getElementById('modelDropdown').classList.remove('open');
    document.getElementById('modelChevron').classList.remove('open');
  }

  // Close dropdown when clicking outside
  document.addEventListener('click', function(e) {
    const wrap = document.getElementById('modelSelectorWrap');
    if (!wrap.contains(e.target)) {
      document.getElementById('modelDropdown').classList.remove('open');
      document.getElementById('modelChevron').classList.remove('open');
    }
  });

  // ── Input ─────────────────────────────────────────────────────────────────
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function onInput(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 200) + 'px';
    document.getElementById('sendBtn').classList.toggle('active', el.value.trim().length > 0);
  }

  function newChat() {
    document.getElementById('messages').innerHTML = `
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-project-badge">
          <div class="project-logo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <rect width="24" height="24" rx="4" fill="#2a5a2a"/>
              <text x="12" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#7fc97f" font-family="Inter,sans-serif">T</text>
            </svg>
          </div>
          <span class="project-name">TMC</span>
        </div>
        <div class="welcome-heading">
          <span class="welcome-asterisk">✳</span>
          <span id="greetingText"></span>
        </div>
      </div>
      <div class="messages-end"></div>`;
    const h = new Date().getHours();
    document.getElementById('greetingText').textContent = (h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening') + ', User';
    const input = document.getElementById('userInput');
    input.value = ''; input.style.height = 'auto';
    document.getElementById('sendBtn').classList.remove('active');
  }

  // ── Send ──────────────────────────────────────────────────────────────────
  function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    const welcome = document.getElementById('welcomeScreen');
    if (welcome) welcome.remove();

    appendUserMessage(text);
    input.value = ''; input.style.height = 'auto';
    document.getElementById('sendBtn').classList.remove('active');

    const thinkingId = showThinking();
    setLoading(true);

    // Pass both message AND selected provider to Apps Script
    google.script.run
      .withSuccessHandler(function(response) {
        removeElement(thinkingId);
        appendAssistantMessage(response);
        setLoading(false);
      })
      .withFailureHandler(function(err) {
        removeElement(thinkingId);
        appendAssistantMessage('Something went wrong: ' + err.message);
        setLoading(false);
      })
      .askDriveIntelligence(text, selectedProvider);
  }

  // ── Renderers ─────────────────────────────────────────────────────────────
  function appendUserMessage(text) {
    const messages = document.getElementById('messages');
    const end = messages.querySelector('.messages-end');
    const row = document.createElement('div');
    row.className = 'message-row';
    row.innerHTML = `
      <div class="message-inner">
        <div class="msg-avatar user">T</div>
        <div class="msg-body">
          <div class="msg-name">You</div>
          <div class="msg-text">${escapeHtml(text)}</div>
        </div>
      </div>`;
    messages.insertBefore(row, end);
    scrollBottom();
  }

  function appendAssistantMessage(text) {
    const messages = document.getElementById('messages');
    const end = messages.querySelector('.messages-end');
    const row = document.createElement('div');
    row.className = 'message-row';

    let mainContent = formatMessage(text);
    let downloadHtml = '';

    try {
      const jsonMatch = text.match(/\{[\s\S]*"download_url"[\s\S]*\}/);
      if (jsonMatch) {
        const fileData = JSON.parse(jsonMatch[0]);
        if (fileData.download_url) {
          const isExcel = fileData.download_url.includes('spreadsheets');
          const icon = isExcel ? '📊' : '📄';
          const type = isExcel ? 'excel' : 'word';
          const ext = isExcel ? 'Excel (.xlsx)' : 'Word (.docx)';
          mainContent = '<p>' + (fileData.message || 'File created successfully.') + '</p>';
          downloadHtml = `
            <div class="download-card">
              <div class="download-icon ${type}">${icon}</div>
              <div class="download-info">
                <div class="download-title">${escapeHtml(fileData.title || 'Download')}</div>
                <div class="download-sub">${ext} · Ready to download</div>
              </div>
              <a class="download-btn" href="${fileData.download_url}" target="_blank">Download</a>
            </div>`;
        }
      }
    } catch(e) {}

    const modelNames = {
      'openrouter': 'TMC AI',
      'openai': 'GPT-4o',
      'claude': 'Claude Sonnet 4.6'
    };
    const modelName = modelNames[selectedProvider] || 'TMC AI';

    row.innerHTML = `
      <div class="message-inner">
        <div class="msg-avatar assistant">✳</div>
        <div class="msg-body">
          <div class="msg-name">TMC Intelligence <span style="font-weight:400;font-size:11px;color:var(--text-tertiary);margin-left:6px;">via ${modelName}</span></div>
          <div class="msg-text">${mainContent}${downloadHtml}</div>
        </div>
      </div>`;
    messages.insertBefore(row, end);
    scrollBottom();
  }

  function showThinking() {
    const messages = document.getElementById('messages');
    const end = messages.querySelector('.messages-end');
    const id = 'tk-' + Date.now();
    const modelNames = {
      'openrouter': 'TMC AI',
      'openai': 'GPT-4o',
      'claude': 'Claude Sonnet 4.6'
    };
    const modelName = modelNames[selectedProvider] || 'TMC AI';
    const row = document.createElement('div');
    row.className = 'thinking-row'; row.id = id;
    row.innerHTML = `
      <div class="thinking-inner">
        <div class="msg-avatar assistant">✳</div>
        <div class="thinking-text">
          <div class="thinking-dots"><span></span><span></span><span></span></div>
          ${modelName} is thinking…
        </div>
      </div>`;
    messages.insertBefore(row, end);
    scrollBottom();
    return id;
  }

  function removeElement(id) { const el = document.getElementById(id); if (el) el.remove(); }

  function setLoading(state) {
    isLoading = state;
    document.getElementById('sendBtn').disabled = state;
    document.getElementById('userInput').disabled = state;
    if (!state) document.getElementById('userInput').focus();
  }

  function scrollBottom() { const m = document.getElementById('messages'); m.scrollTop = m.scrollHeight; }

  function escapeHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  function formatMessage(text) {
    let t = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    t = t.replace(/```[\s\S]*?```/g, m => `<pre><code>${m.replace(/^```[a-z]*\n?/,'').replace(/```$/,'')}</code></pre>`);
    t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
    t = t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
    t = t.replace(/\*(.*?)\*/g,'<em>$1</em>');
    t = t.replace(/^### (.+)$/gm,'<h3>$1</h3>');
    t = t.replace(/^## (.+)$/gm,'<h2>$1</h2>');
    t = t.replace(/^# (.+)$/gm,'<h1>$1</h1>');
    t = t.replace(/^\- (.+)$/gm,'<li>$1</li>');
    t = t.replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>');
    t = t.split(/\n\n+/).map(b => {
      b = b.trim(); if (!b) return '';
      if (/^<(h[1-3]|ul|pre|li)/.test(b)) return b;
      return '<p>' + b.replace(/\n/g,'<br>') + '</p>';
    }).join('');
    return t;
  }

  window.addEventListener('load', () => document.getElementById('userInput').focus());
</script>
</body>
</html>
